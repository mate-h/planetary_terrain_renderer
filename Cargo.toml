[package]
name = "bevy_terrain"
description = "Terrain Rendering for the Bevy Engine."
version = "0.1.0-dev"
license = "MIT OR Apache-2.0"
edition = "2024"
categories = ["game-engines", "rendering", "graphics"]
keywords = ["gamedev", "graphics", "bevy", "terrain"]
exclude = ["assets/*"]
readme = "README.md"
authors = ["Kurt Kühnert <kurt@kuehnert.dev>"]
repository = "https://github.com/kurtkuehnert/bevy_terrain"

[workspace]
members = ["preprocess"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("webgpu"))'] }

[features]
rand = ["dep:rand"]
metal_capture = ["dep:wgpu-core", "dep:objc2-metal", "dep:objc2-foundation"]

[dependencies]
bevy = "0.19"
bevy_common_assets = { version = "0.17", features = ["ron"] }
big_space = { git = "https://github.com/m-edlund/big_space", rev = "79e04cc01a84f3b8d199a0f97aaeb8245f203b16", features = ["i32"] }
tiff = "0.10"
bytemuck = "1.14"
ndarray = "0.16.1"
itertools = "0.14.0"
indexmap = "2.12"
bitflags = "2.4"
serde = "1.0.210"
ron = "0.12"
async-channel = "2.1"
slab = "0.4.9"
strum = "0.27.1"
strum_macros = "0.27.1"

rand = { version = "0.9.0", optional = true }
wgpu-core = { version = "29.0.3", optional = true, default-features = false, features = ["metal", "std"] } # keep in sync with bevy's wgpu
objc2-metal = { version = "0.3.2", optional = true, default-features = false, features = ["MTLCaptureManager", "MTLDevice", "std"] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["NSString", "NSURL", "std"] }

[[example]]
name = "spherical"
path = "examples/spherical.rs"

[[example]]
name = "precision_demo"
path = "examples/precision_demo.rs"
required-features = ["rand"]

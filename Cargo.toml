[package]
name = "bevy_terrain"
description = "Terrain Rendering for the Bevy Engine."
version = "0.1.0-dev"
license = "MIT OR Apache-2.0"
edition = "2024"
categories = ["game-engines", "rendering", "graphics"]
keywords = ["gamedev", "graphics", "bevy", "terrain"]
exclude = ["assets/*"]
readme = "README.md"
authors = ["Kurt Kühnert <kurt@kuehnert.dev>"]
repository = "https://github.com/kurtkuehnert/bevy_terrain"

[workspace]
members = ["preprocess"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("webgpu"))'] }

[features]
rand = ["dep:rand"]
metal_capture = []
bluenoise_texture = ["bevy/bluenoise_texture"]

[dependencies]
bevy = { path = "../bevy", default-features = false, features = ["3d"] }
big_space = { path = "../big_space", features = ["i32"] }
tiff = "0.10"
bytemuck = "1.14"
ndarray = "0.16.1"
itertools = "0.14.0"
indexmap = "2.12"
bitflags = "2.4"
serde = "1.0.210"
ron = "0.12"
async-channel = "2.1"
slab = "0.4.9"
strum = "0.27.1"
strum_macros = "0.27.1"

rand = { version = "0.9.0", optional = true }
# wgpu-core optional dep removed for Bevy 0.20 workspace compatibility; re-add with patched git when metal_capture is needed

[[example]]
name = "spherical"
path = "examples/spherical.rs"

[[example]]
name = "precision_demo"
path = "examples/precision_demo.rs"
required-features = ["rand"]

[patch.crates-io]
wgpu = { git = "https://github.com/stuartparmenter/wgpu", rev = "af64796742a9046d4c0b1bdd06e2439c3435e93e" }
wgpu-types = { git = "https://github.com/stuartparmenter/wgpu", rev = "af64796742a9046d4c0b1bdd06e2439c3435e93e" }
wgpu-naga-bridge = { git = "https://github.com/stuartparmenter/wgpu", rev = "af64796742a9046d4c0b1bdd06e2439c3435e93e" }
naga = { git = "https://github.com/stuartparmenter/wgpu", rev = "af64796742a9046d4c0b1bdd06e2439c3435e93e" }
